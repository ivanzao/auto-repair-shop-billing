apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      serviceAccountName: billing
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: billing
          image: ghcr.io/ivanzao/auto-repair-shop-billing:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
            - secretRef:
                name: billing-mercadopago
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
