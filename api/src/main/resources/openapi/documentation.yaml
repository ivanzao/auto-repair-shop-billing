openapi: "3.1.0"
info:
  title: "Auto Repair Shop Billing API"
  description: |
    API do billing service - FIAP SOAT.

    Responsável pela geração e aprovação de orçamentos e pelo registro de
    pagamentos via Mercado Pago. Participa da saga coreografada consumindo
    eventos do order e do execution e publicando os seus próprios.

    A maior parte do fluxo do billing é assíncrona, por eventos. Esta API HTTP
    expõe apenas os pontos que precisam de entrada externa: os links de decisão
    do orçamento enviados por e-mail ao cliente e o webhook do Mercado Pago.
  version: "1.0.0"

servers:
  - url: "http://localhost:8080"
    description: "Local development server"

tags:
  - name: Health
    description: "Health check da aplicação"
  - name: Quote
    description: "Aprovação e recusa de orçamentos pelo cliente"
  - name: Payment
    description: "Integração com o Mercado Pago"

paths:
  /health:
    get:
      tags:
        - Health
      summary: "Health check"
      description: "Verifica se a aplicação está no ar. Usado pelas probes do Kubernetes."
      responses:
        "200":
          description: "Aplicação saudável"
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "OK"

  /metrics:
    get:
      tags:
        - Health
      summary: "Métricas Prometheus"
      description: "Métricas no formato Prometheus, coletadas pelo ServiceMonitor."
      responses:
        "200":
          description: "Métricas expostas"
          content:
            text/plain:
              schema:
                type: string

  /v1/quotes/approve:
    get:
      tags:
        - Quote
      summary: "Aprova um orçamento"
      description: |
        Aprova o orçamento associado ao token e redireciona o cliente para o
        checkout do Mercado Pago.

        É um `GET` porque o endpoint é acessado diretamente pelo link enviado no
        e-mail de orçamento, clicado pelo cliente no navegador. A resposta é um
        redirect 302 para o `init_point` da preferência de pagamento.

        Ao aprovar, o billing publica `QuoteApproved` na saga.
      parameters:
        - name: token
          in: query
          required: true
          description: "Token de aprovação (UUID) gerado junto do orçamento e enviado no e-mail"
          schema:
            type: string
            format: uuid
          example: "3f2504e0-4f89-11d3-9a0c-0305e82c3301"
      responses:
        "302":
          description: "Redirect para o checkout do Mercado Pago"
          headers:
            Location:
              description: "init_point da preferência de pagamento"
              schema:
                type: string
                format: uri
        "400":
          description: "Token ausente ou não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "INVALID_APPROVAL_TOKEN"
                message: "Invalid approval token"
        "404":
          description: "Nenhum orçamento encontrado para o token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "QUOTE_NOT_FOUND"
                message: "Quote not found"
        "422":
          description: "Orçamento em estado que não permite aprovação"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/quotes/decline:
    get:
      tags:
        - Quote
      summary: "Recusa um orçamento"
      description: |
        Recusa o orçamento associado ao token.

        Assim como o endpoint de aprovação, é um `GET` por ser acessado pelo link
        do e-mail. Ao recusar, o billing publica `QuoteRejected`, que dispara a
        compensação na saga: o execution libera as peças reservadas e o order
        cancela a OS.
      parameters:
        - name: token
          in: query
          required: true
          description: "Token de aprovação (UUID) gerado junto do orçamento e enviado no e-mail"
          schema:
            type: string
            format: uuid
          example: "3f2504e0-4f89-11d3-9a0c-0305e82c3301"
      responses:
        "200":
          description: "Orçamento recusado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples:
                      - "declined"
        "400":
          description: "Token ausente ou não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Nenhum orçamento encontrado para o token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Orçamento em estado que não permite recusa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/webhooks/mercadopago:
    post:
      tags:
        - Payment
      summary: "Webhook de notificação do Mercado Pago"
      description: |
        Recebe as notificações de mudança de status de pagamento do Mercado Pago.

        O corpo da requisição é lido mas não é utilizado: o identificador do
        pagamento vem do query parameter `data.id` (ou `id`, dependendo do tipo de
        notificação), e o billing consulta a API do Mercado Pago para obter o
        status real. Essa consulta ativa evita confiar em um corpo que poderia ser
        forjado.

        A requisição é autenticada pela assinatura HMAC nos headers `x-signature` e
        `x-request-id`. Assinatura inválida ou ausente resulta em 401, sem
        processamento.

        Confirmado o pagamento, o billing publica `PaymentConfirmed`; recusado,
        publica `PaymentFailed`, que dispara compensação na saga.
      parameters:
        - name: data.id
          in: query
          required: false
          description: "Identificador do pagamento no Mercado Pago. Alternativa: `id`."
          schema:
            type: string
          example: "1234567890"
        - name: id
          in: query
          required: false
          description: "Identificador do pagamento, usado quando `data.id` não vem na notificação"
          schema:
            type: string
        - name: x-signature
          in: header
          required: true
          description: "Assinatura HMAC da notificação, no formato `ts=<timestamp>,v1=<hash>`"
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          description: "Identificador da requisição, usado na composição da assinatura"
          schema:
            type: string
      requestBody:
        required: false
        description: "Corpo da notificação do Mercado Pago. Lido, mas não utilizado."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              action: "payment.updated"
              type: "payment"
              data:
                id: "1234567890"
      responses:
        "200":
          description: "Notificação processada"
        "401":
          description: "Assinatura inválida, ausente, ou identificador do pagamento ausente"

components:
  schemas:
    ErrorResponse:
      type: object
      description: "Formato padrão de erro da aplicação"
      properties:
        code:
          type: string
          description: "Código do erro"
          examples:
            - "QUOTE_NOT_FOUND"
        message:
          type: string
          description: "Descrição legível do erro"
          examples:
            - "Quote not found"
      required:
        - code
        - message

    ValidationError:
      type: object
      description: "Erro de validação de entrada, com detalhamento por campo"
      properties:
        code:
          type: string
          examples:
            - "BAD_REQUEST"
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                examples:
                  - "token"
              message:
                type: string
                examples:
                  - "Field is required"
            required:
              - field
              - message
      required:
        - code
        - fieldErrors
