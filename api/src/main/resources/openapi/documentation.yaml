openapi: "3.1.0"
info:
  title: "Auto Repair Shop Billing API"
  description: |
    API do billing service - FIAP SOAT.

    Responsável pela geração e aprovação de orçamentos e pelo registro de
    pagamentos via Mercado Pago. Participa da saga coreografada consumindo
    eventos do order e do execution e publicando os seus próprios.

    A maior parte do fluxo do billing é assíncrona, por eventos. Esta API HTTP
    expõe apenas os pontos que precisam de entrada externa: os links de decisão
    do orçamento enviados por e-mail ao cliente e o webhook do Mercado Pago.
  version: "1.0.0"

servers:
  - url: "http://localhost:8080"
    description: "Local development server"

tags:
  - name: Health
    description: "Health check da aplicação"
  - name: Quote
    description: "Aprovação e recusa de orçamentos pelo cliente"

paths:
  /health:
    get:
      tags:
        - Health
      summary: "Health check"
      description: "Verifica se a aplicação está no ar. Usado pelas probes do Kubernetes."
      responses:
        "200":
          description: "Aplicação saudável"
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "OK"

  /metrics:
    get:
      tags:
        - Health
      summary: "Métricas Prometheus"
      description: "Métricas no formato Prometheus, coletadas pelo ServiceMonitor."
      responses:
        "200":
          description: "Métricas expostas"
          content:
            text/plain:
              schema:
                type: string

  /v1/quotes/approve:
    get:
      tags:
        - Quote
      summary: "Aprova um orçamento"
      description: |
        Aprova o orçamento associado ao token e redireciona o cliente para o
        checkout do Mercado Pago.

        É um `GET` porque o endpoint é acessado diretamente pelo link enviado no
        e-mail de orçamento, clicado pelo cliente no navegador. A resposta é um
        redirect 302 para o `init_point` da preferência de pagamento.

        Ao aprovar, o billing publica `QuoteApproved` na saga.
      parameters:
        - name: token
          in: query
          required: true
          description: "Token de aprovação (UUID) gerado junto do orçamento e enviado no e-mail"
          schema:
            type: string
            format: uuid
          example: "3f2504e0-4f89-11d3-9a0c-0305e82c3301"
      responses:
        "302":
          description: "Redirect para o checkout do Mercado Pago"
          headers:
            Location:
              description: "init_point da preferência de pagamento"
              schema:
                type: string
                format: uri
        "400":
          description: "Token ausente ou não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "INVALID_APPROVAL_TOKEN"
                message: "Invalid approval token"
        "404":
          description: "Nenhum orçamento encontrado para o token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "QUOTE_NOT_FOUND"
                message: "Quote not found"
        "422":
          description: "Orçamento em estado que não permite aprovação"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/quotes/decline:
    get:
      tags:
        - Quote
      summary: "Recusa um orçamento"
      description: |
        Recusa o orçamento associado ao token.

        Assim como o endpoint de aprovação, é um `GET` por ser acessado pelo link
        do e-mail. Ao recusar, o billing publica `QuoteRejected`, que dispara a
        compensação na saga: o execution libera as peças reservadas e o order
        cancela a OS.
      parameters:
        - name: token
          in: query
          required: true
          description: "Token de aprovação (UUID) gerado junto do orçamento e enviado no e-mail"
          schema:
            type: string
            format: uuid
          example: "3f2504e0-4f89-11d3-9a0c-0305e82c3301"
      responses:
        "200":
          description: "Orçamento recusado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples:
                      - "declined"
        "400":
          description: "Token ausente ou não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Nenhum orçamento encontrado para o token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Orçamento em estado que não permite recusa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      description: "Formato padrão de erro da aplicação"
      properties:
        code:
          type: string
          description: "Código do erro"
          examples:
            - "QUOTE_NOT_FOUND"
        message:
          type: string
          description: "Descrição legível do erro"
          examples:
            - "Quote not found"
      required:
        - code
        - message

    ValidationError:
      type: object
      description: "Erro de validação de entrada, com detalhamento por campo"
      properties:
        code:
          type: string
          examples:
            - "BAD_REQUEST"
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                examples:
                  - "token"
              message:
                type: string
                examples:
                  - "Field is required"
            required:
              - field
              - message
      required:
        - code
        - fieldErrors
