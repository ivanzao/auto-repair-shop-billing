application:
  profile: "${APPLICATION_PROFILE:dev}"

server:
  port: "${SERVER_PORT:8080}"

database:
  driverClassName: org.postgresql.Driver
  url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/auto_repair_shop_billing_local}"
  username: "${DATABASE_USERNAME:app_billing_local}"
  password: "${DATABASE_PASSWORD:changeme}"
  maximumPoolSize: "${DATABASE_MAX_POOL_SIZE:6}"

app:
  base_url: "${APP_BASE_URL:http://localhost:8080}"

quote:
  approval:
    ttl_days: "${QUOTE_APPROVAL_TTL_DAYS:5}"

sns:
  topic:
    arn: "${SNS_TOPIC_ARN}"

sqs:
  queue:
    url: "${SQS_QUEUE_URL}"

aws:
  region: "${AWS_REGION:us-east-1}"
  endpoint: "${AWS_ENDPOINT:}"
  accessKeyId: "${AWS_ACCESS_KEY_ID:}"
  secretAccessKey: "${AWS_SECRET_ACCESS_KEY:}"

mercadopago:
  api_url: "${MERCADOPAGO_API_URL:https://api.mercadopago.com}"
  access_token: "${MERCADOPAGO_ACCESS_TOKEN}"
  webhook_secret: "${MERCADOPAGO_WEBHOOK_SECRET}"
