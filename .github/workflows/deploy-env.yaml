name: Deploy to environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Read SSM params (cluster, db secret, SNS topic, SQS queue, API GW)
        id: ssm
        run: |
          CLUSTER=$(aws ssm get-parameter --name /auto-repair-shop/${{ env.ENV }}/eks/cluster-name --query Parameter.Value --output text)
          DB_SECRET_ARN=$(aws ssm get-parameter --name /auto-repair-shop/${{ env.ENV }}/billing/db/secret-arn --query Parameter.Value --output text)
          SNS_TOPIC=$(aws ssm get-parameter --name /auto-repair-shop/${{ env.ENV }}/sns/billing-events-topic-arn --query Parameter.Value --output text)
          QUEUE_URL=$(aws ssm get-parameter --name /auto-repair-shop/${{ env.ENV }}/sqs/billing-queue-url --query Parameter.Value --output text)
          APIGW=$(aws ssm get-parameter --name /auto-repair-shop/${{ env.ENV }}/apigw/endpoint --query Parameter.Value --output text)
          NODE_PORT=$(aws ssm get-parameter --name /auto-repair-shop/${{ env.ENV }}/billing/node-port --query Parameter.Value --output text)
          {
            echo "cluster=$CLUSTER"
            echo "db_secret_arn=$DB_SECRET_ARN"
            echo "sns_topic=$SNS_TOPIC"
            echo "queue_url=$QUEUE_URL"
            echo "apigw_endpoint=$APIGW"
            echo "node_port=$NODE_PORT"
          } >> "$GITHUB_OUTPUT"

      - name: Read DB credentials from Secrets Manager
        id: db
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id ${{ steps.ssm.outputs.db_secret_arn }} --query SecretString --output text)
          DB_HOST=$(echo "$SECRET_JSON" | jq -r .host)
          DB_PORT=$(echo "$SECRET_JSON" | jq -r .port)
          DB_NAME=$(echo "$SECRET_JSON" | jq -r .dbname)
          DB_USER=$(echo "$SECRET_JSON" | jq -r .username)
          DB_PWD=$(echo "$SECRET_JSON" | jq -r .password)
          {
            echo "host=$DB_HOST"
            echo "port=$DB_PORT"
            echo "name=$DB_NAME"
            echo "user=$DB_USER"
            echo "password=$DB_PWD"
          } >> "$GITHUB_OUTPUT"

      - name: Populate Mercado Pago secret (consumed by ESO)
        run: |
          aws secretsmanager put-secret-value \
            --secret-id auto-repair-shop/${{ env.ENV }}/mercadopago \
            --secret-string "{\"access_token\":\"${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}\",\"webhook_secret\":\"${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}\"}"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ steps.ssm.outputs.cluster }} --region ${{ env.AWS_REGION }}

      - name: Create K8s Secret with DB password
        run: |
          kubectl create secret generic billing-secret \
            --namespace=auto-repair-shop-${{ env.ENV }} \
            --from-literal="DATABASE_PASSWORD=${{ steps.db.outputs.password }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create K8s Secret for GHCR image pull
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=auto-repair-shop-${{ env.ENV }} \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Rewrite ConfigMap overlay with runtime values
        working-directory: infra/k8s/overlays/${{ env.ENV }}
        run: |
          cat > configmap-patch.yaml <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: billing-config
          data:
            APPLICATION_PROFILE: "${{ env.ENV }}"
            DATABASE_URL: "jdbc:postgresql://${{ steps.db.outputs.host }}:${{ steps.db.outputs.port }}/${{ steps.db.outputs.name }}"
            DATABASE_USERNAME: "${{ steps.db.outputs.user }}"
            SNS_TOPIC_ARN: "${{ steps.ssm.outputs.sns_topic }}"
            SQS_QUEUE_URL: "${{ steps.ssm.outputs.queue_url }}"
            APP_BASE_URL: "${{ steps.ssm.outputs.apigw_endpoint }}"
            MERCADOPAGO_API_URL: "https://api.mercadopago.com"
          EOF

      - name: Rewrite Service nodePort from SSM
        working-directory: infra/k8s/overlays/${{ env.ENV }}
        run: |
          cat > nodeport-patch.yaml <<EOF
          - op: add
            path: /spec/ports/0/nodePort
            value: ${{ steps.ssm.outputs.node_port }}
          EOF

      - name: Set image tag in overlay
        working-directory: infra/k8s/overlays/${{ env.ENV }}
        run: |
          kustomize edit set image ghcr.io/ivanzao/auto-repair-shop-billing=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}

      - name: Apply Kustomize overlay
        run: kubectl apply -k infra/k8s/overlays/${{ env.ENV }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/billing -n auto-repair-shop-${{ env.ENV }} --timeout=300s

      - name: Ensure OTel agent injected
        run: |
          NS=auto-repair-shop-${{ env.ENV }}
          agent=$(kubectl get pods -n "$NS" -l app=billing \
            -o jsonpath='{range .items[*]}{range .spec.initContainers[*]}{.name}{"\n"}{end}{end}' \
            | grep -c opentelemetry-auto-instrumentation-java || true)
          if [ "$agent" -eq 0 ]; then
            echo "::warning::OTel agent not injected (mpod webhook raced pod creation); restarting"
            kubectl rollout restart deployment/billing -n "$NS"
            kubectl rollout status deployment/billing -n "$NS" --timeout=300s
          else
            echo "OTel agent present."
          fi

      - name: Smoke test via API Gateway
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.ssm.outputs.apigw_endpoint }}/billing/health")
            if [ "$CODE" = "200" ]; then
              echo "Smoke test passed (status=200)"
              exit 0
            fi
            echo "Attempt $i/10 - got status $CODE, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed after 10 attempts"
          exit 1
